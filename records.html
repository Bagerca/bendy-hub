<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Архивы Студии | Bendy Wiki</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/layout.css">
    <link rel="stylesheet" href="shared/css/ui.css">
    <link rel="stylesheet" href="pages/records/records.css">
    
    <script>
        const savedTheme = localStorage.getItem('bendy-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <site-header active-page="records"></site-header>

    <main class="page-content archives-layout">
        
        <!-- ЛЕВАЯ КОЛОНКА: Навигация -->
        <aside class="archives-sidebar">
            <div class="sidebar-header">
                <h3>Каталог Архивов</h3>
            </div>
            <nav id="category-nav" class="category-nav">
                <!-- Категории загрузятся сюда из шаблона -->
            </nav>
        </aside>

        <!-- ПРАВАЯ КОЛОНКА: Контент -->
        <section class="archives-main">
            
            <div class="archives-header">
                <h1 id="current-category-title">Загрузка архивов...</h1>
                <p id="current-category-count" class="meta-count" style="display: none;"></p>
            </div>

            <div id="records-loader" class="loading-state">
                <div class="spinner" style="margin: 0 auto 10px;"></div>
                <span>Расшифровка данных...</span>
            </div>

            <div id="records-grid" class="records-grid" style="display: none;">
                <!-- Карточки загрузятся сюда из шаблона -->
            </div>
        </section>
    </main>

    <!-- МОДАЛКА ДЛЯ ЧТЕНИЯ -->
    <dialog id="record-modal" class="custom-modal reader-modal">
        <button class="modal-close" aria-label="Закрыть">&times;</button>
        
        <div class="reader-content">
            <img id="reader-image" src="" alt="Фото записи" class="reader-image" style="display: none;">
            
            <div class="reader-header">
                <h2 id="reader-title"></h2>
                <span id="reader-author" class="reader-author"></span>
            </div>
            
            <div class="reader-body">
                <p id="reader-text"></p>
            </div>
        </div>
    </dialog>

    <!-- ================= ТЕМПЛЕЙТЫ ================= -->
    
    <!-- Шаблон кнопки бокового меню -->
    <template id="category-btn-template">
        <button class="cat-btn"></button>
    </template>

    <!-- Шаблон карточки записи -->
    <template id="record-card-template">
        <article class="record-card">
            <div class="card-image-wrapper">
                <img src="" class="card-image" loading="lazy" alt="Обложка" style="display: none;">
                <div class="card-fallback-icon">
                    <!-- Иконка Аудио -->
                    <svg class="icon-audio" style="display: none;" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><path d="M10 12h4"></path>
                    </svg>
                    <!-- Иконка Документа -->
                    <svg class="icon-document" style="display: none;" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
            </div>
            <div class="card-content">
                <span class="card-type-badge"></span>
                <h3 class="card-title"></h3>
                <span class="card-author"></span>
            </div>
        </article>
    </template>

    <!-- Шаблон ошибки -->
    <template id="error-state-template">
        <div class="error-card">
            <p class="error-message"></p>
        </div>
    </template>

    <script type="module" src="pages/records/app.js"></script>
</body>
</html>
