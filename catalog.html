<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог Проектов | Bendy Hub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/layout.css">
    <link rel="stylesheet" href="shared/css/ui.css">
    
    <link rel="stylesheet" href="pages/catalog/catalog.css">
    <link rel="stylesheet" href="pages/catalog/card-horizontal.css">
    <link rel="stylesheet" href="pages/catalog/card-vertical.css">
    
    <script>
        const savedTheme = localStorage.getItem('bendy-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <site-header active-page="catalog"></site-header>

    <main class="page-content catalog-container">
        
        <search-controls placeholder="Поиск по названию (Enter)...">
            <!-- Кнопки сортировки (Только иконки) -->
            <div class="sort-toggles">
                <button id="sort-date-btn" class="sort-btn active" data-type="date" aria-label="Сортировка по дате" title="Сортировка по дате">
                    <svg class="sort-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <svg class="sort-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
                
                <button id="sort-alpha-btn" class="sort-btn" data-type="alpha" aria-label="Сортировка по алфавиту" title="Сортировка по алфавиту">
                    <svg class="sort-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                    <svg class="sort-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>

            <!-- ФИЛЬТР: Тип проекта -->
            <div class="custom-select-container" id="type-filter-container">
                <button class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                    <div class="custom-select-value">
                        <span class="custom-select-text-value">Все проекты</span>
                    </div>
                    <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <ul class="custom-select-dropdown" role="listbox"></ul>
            </div>
        </search-controls>

        <div id="catalog-loader" class="loading-state">
            <div class="spinner" style="margin: 0 auto 10px;"></div>
            <span>Синхронизация каталога...</span>
        </div>
        
        <div id="catalog-content" style="display: none;"></div>
    </main>

    <!-- ТЕМПЛЕЙТ #1: ГОРИЗОНТАЛЬНАЯ КАРТОЧКА -->
    <template id="template-card-horizontal">
        <article class="card-horizontal">
            <div class="card-cover-container">
                <div class="card-badges">
                    <span class="status-badge"></span>
                </div>
                <img src="" alt="" class="card-cover-img" loading="lazy">
                
                <div class="card-cover-fallback"></div>
            </div>
            <footer class="card-info">
                <h3 class="card-title"></h3>
                <time class="card-year"></time>
            </footer>
        </article>
    </template>

    <!-- ТЕМПЛЕЙТ #2: ВЕРТИКАЛЬНАЯ КАРТОЧКА -->
    <template id="template-card-vertical">
        <article class="card-vertical">
            <div class="card-cover-container">
                <div class="card-badges">
                    <span class="status-badge"></span>
                </div>
                <img src="" alt="" class="card-cover-img" loading="lazy">
                
                <div class="card-cover-fallback"></div>
            </div>
            <footer class="card-info">
                <h3 class="card-title"></h3>
                <time class="card-year"></time>
            </footer>
        </article>
    </template>

    <template id="empty-state-template">
        <div class="empty-state">
            <h3 class="empty-state-title">Ничего не найдено</h3>
            <p class="empty-state-desc">Измените параметры поиска или фильтры.</p>
        </div>
    </template>

    <script type="module" src="pages/catalog/app.js"></script>
</body>
</html>
