<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bendy Hub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- ГЛОБАЛЬНЫЕ СТИЛИ -->
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/layout.css">
    <link rel="stylesheet" href="shared/css/ui.css">
    
    <!-- СТИЛИ СТРАНИЦ -->
    <link rel="stylesheet" href="pages/home/home.css">
    <link rel="stylesheet" href="pages/catalog/catalog.css">
    <link rel="stylesheet" href="pages/catalog/card-horizontal.css">
    <link rel="stylesheet" href="pages/catalog/card-vertical.css">
    <link rel="stylesheet" href="pages/project/project.css">
    <link rel="stylesheet" href="pages/project/hero.css">
    <link rel="stylesheet" href="pages/project/gallery.css">
    <link rel="stylesheet" href="pages/project/widgets.css">
    <link rel="stylesheet" href="pages/characters/characters.css">
    <link rel="stylesheet" href="pages/character/character.css">
    <link rel="stylesheet" href="pages/music/music.css">
    <link rel="stylesheet" href="pages/music/song-card.css">
    <link rel="stylesheet" href="pages/music/floating-player.css">
    <link rel="stylesheet" href="pages/music/lyrics-panel.css">
    <link rel="stylesheet" href="pages/feed/feed.css">
    <link rel="stylesheet" href="pages/timeline/timeline.css">
    <link rel="stylesheet" href="pages/records/records.css">
    
    <script>
        const savedTheme = localStorage.getItem('bendy-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div id="ambient-bg" class="ambient-bg"></div>

    <site-header active-page="home"></site-header>

    <!-- СЮДА РОУТЕР БУДЕТ ВСТАВЛЯТЬ СТРАНИЦЫ -->
    <div id="app-root"></div>

    <!-- ГЛОБАЛЬНЫЙ ЛАЙТБОКС -->
    <dialog id="lightbox" class="lightbox" aria-modal="true" aria-label="Просмотр медиафайла">
        <button class="lightbox-close" aria-label="Закрыть"></button>
        <img id="lightbox-img" src="" alt="Full image">
    </dialog>
    
    <!-- ГЛОБАЛЬНЫЕ ОШИБКИ И ПУСТЫЕ СОСТОЯНИЯ -->
    <template id="empty-state-template">
        <div class="empty-state">
            <div class="empty-state-icon dyn-icon-empty-search">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 491.52 491.52" xmlns="http://www.w3.org/2000/svg"><g><path d="M0,0v491.52h491.52V0H0z M471.04,471.04H20.48V102.4h450.56V471.04z M471.04,81.92H20.48V20.48h450.56V81.92z"></path><rect x="40.96" y="40.96" width="20.48" height="20.48"></rect><rect x="81.92" y="40.96" width="20.48" height="20.48"></rect><rect x="122.88" y="40.96" width="20.48" height="20.48"></rect><rect x="194.56" y="40.96" width="245.76" height="20.48"></rect><polygon points="143.36,245.76 143.36,276.48 92.16,276.48 92.16,194.56 71.68,194.56 71.68,296.96 143.36,296.96 143.36,368.64 163.84,368.64 163.84,245.76 "></polygon><polygon points="389.12,245.76 389.12,276.48 337.92,276.48 337.92,194.56 317.44,194.56 317.44,296.96 389.12,296.96 389.12,368.64 409.6,368.64 409.6,245.76 "></polygon><path d="M240.64,194.56c-31.055,0-56.32,25.27-56.32,56.32v61.44c0,31.05,25.265,56.32,56.32,56.32s56.32-25.27,56.32-56.32 v-61.44C296.96,219.83,271.695,194.56,240.64,194.56z M276.48,312.32c0,19.76-16.08,35.84-35.84,35.84s-35.84-16.08-35.84-35.84 v-61.44c0-19.76,16.08-35.84,35.84-35.84s35.84,16.08,35.84,35.84V312.32z"></path><rect x="143.36" y="133.12" width="204.8" height="20.48"></rect><rect x="143.36" y="419.84" width="204.8" height="20.48"></rect></g></svg>
            </div>
            <h3 class="empty-state-title">Ничего не найдено</h3>
            <p class="empty-state-desc">По вашему запросу ничего не найдено. Измените параметры поиска.</p>
        </div>
    </template>

    <template id="error-state-template">
        <div class="error-card" style="grid-column: 1/-1"><p class="error-message"></p></div>
    </template>

    <!-- Главная: Карточки -->
    <template id="stat-card-template"><div class="stat-item"><div class="stat-icon-wrap"></div><div class="stat-text-wrap"><span class="stat-value"></span><span class="stat-label"></span></div></div></template>
    <template id="team-member-template"><div class="discord-member"><div class="member-avatar-wrapper"><img src="" alt="Avatar" class="member-avatar"><span class="status-indicator"></span></div><div class="member-info"><div class="member-header-row"><span class="member-name"></span><span class="role-badge"></span></div><span class="member-status"></span></div><a href="#" target="_blank" rel="noopener noreferrer" class="member-link-btn dyn-icon-external" title="Перейти в профиль"></a></div></template>

    <!-- Каталог: Карточки -->
    <template id="template-card-horizontal"><article class="card-horizontal"><div class="card-cover-container"><div class="card-badges"><span class="status-badge"></span></div><img src="" alt="" class="card-cover-img" loading="lazy"><div class="card-cover-fallback"></div></div><footer class="card-info"><h3 class="card-title"></h3><time class="card-year"></time></footer></article></template>
    <template id="template-card-vertical"><article class="card-vertical"><div class="card-cover-container"><div class="card-badges"><span class="status-badge"></span></div><img src="" alt="" class="card-cover-img" loading="lazy"><div class="card-cover-fallback"></div></div><footer class="card-info"><h3 class="card-title"></h3><time class="card-year"></time></footer></article></template>

    <!-- Персонажи: Карточка -->
    <template id="char-card-template"><a href="" class="char-card"><div class="char-avatar-wrapper"></div><span class="char-card-name"></span></a></template>

    <!-- Музыка: Карточка -->
    <template id="song-card-template"><article class="song-card"><div class="song-cover-wrapper"><div class="no-audio-badge" style="display: none;">Нет медиа</div><img src="" alt="" class="song-cover" loading="lazy"><div class="song-overlay"></div><button class="song-play-btn dyn-icon-play"></button></div><div class="song-info"><div class="song-text-wrap"><h3 class="song-title"></h3><p class="song-artist"></p></div><div class="song-meta"><span class="song-year"></span><span class="song-game"></span></div></div></article></template>

    <!-- Лента: Пост и Скелетон. Иконки вырезаны и вставляются через PostView.js -->
    <template id="post-template"><article class="post-card"><header class="post-header"><img src="" alt="Avatar" class="post-avatar" loading="lazy"><div class="post-meta"><h2 class="post-author-name"></h2><a class="post-author-handle" target="_blank" rel="noopener noreferrer"></a></div><span class="post-platform-badge"></span></header><div class="post-content"><div class="rt-badge" style="display: none;"><span>Оригинал: <a class="rt-author" target="_blank" rel="noopener noreferrer"></a></span></div><p class="post-text"></p><div class="post-translation" style="display: none;"><div class="post-translation-header">Перевод</div><p class="post-translation-text"></p></div><img src="" alt="Вложение" class="post-media img-media" loading="lazy" style="display: none;" title="Нажмите для увеличения"><video class="post-media video-media" autoplay loop muted playsinline style="display: none;"></video></div><footer class="post-footer"><time class="post-date" datetime=""></time><div class="post-actions"><button class="action-btn translate-btn" aria-label="Перевести" title="Перевести"><span>Перевести</span></button><button class="action-btn copy-btn" aria-label="Скопировать" title="Скопировать"></button></div></footer></article></template>
    <template id="skeleton-template"><div class="post-card skeleton-card"><header class="post-header"><div class="skeleton-avatar skeleton-pulse"></div><div class="post-meta" style="gap: 8px;"><div class="skeleton-line skeleton-pulse" style="width: 120px;"></div><div class="skeleton-line skeleton-pulse" style="width: 80px; height: 10px;"></div></div></header><div class="post-content" style="gap: 12px; display: flex; flex-direction: column;"><div class="skeleton-line skeleton-pulse" style="width: 100%;"></div><div class="skeleton-line skeleton-pulse" style="width: 90%;"></div><div class="skeleton-line skeleton-pulse" style="width: 60%;"></div><div class="skeleton-pulse" style="width: 100%; height: 200px; border-radius: 12px; margin-top: 10px;"></div></div></div></template>

    <!-- Хронология: Карточки -->
    <template id="era-nav-template"><button class="era-btn" data-target=""></button></template>
    <template id="era-marker-template"><div class="timeline-era-marker"><h2 class="era-title"></h2></div></template>
    <template id="event-card-template"><div class="timeline-event-wrapper"><div class="timeline-node"></div><article class="timeline-card"><span class="event-date"></span><h3 class="event-title"></h3><p class="event-desc"></p><img src="" class="event-image" loading="lazy" alt="Event image" style="display: none;"></article></div></template>

    <!-- Архивы: Карточки -->
    <template id="category-btn-template"><button class="cat-btn"></button></template>
    <template id="record-card-template"><article class="record-card"><div class="card-image-wrapper"><img src="" class="card-image" loading="lazy" alt="Обложка" style="display: none;"><div class="card-fallback-icon"></div></div><div class="card-content"><h3 class="card-title"></h3><span class="card-author"></span></div></article></template>

    <script type="module" src="main.js"></script>
</body>
</html>
