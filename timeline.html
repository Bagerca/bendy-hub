<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хронология | Bendy Wiki</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <!-- Правильные пути от корня -->
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/layout.css">
    <link rel="stylesheet" href="shared/css/ui.css">
    <link rel="stylesheet" href="pages/timeline/timeline.css">
    
    <script>
        const savedTheme = localStorage.getItem('bendy-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <site-header active-page="timeline"></site-header>

    <main class="page-content">
        
        <!-- Переключатель режимов -->
        <div class="timeline-mode-toggle">
            <div class="toggle-track">
                <button class="mode-btn active" data-mode="lore">Внутриигровая история</button>
                <button class="mode-btn" data-mode="dev">История разработки</button>
            </div>
        </div>

        <!-- Липкая панель навигации по эпохам -->
        <nav id="era-nav" class="era-nav"></nav>

        <!-- Контейнер хронологии -->
        <div class="timeline-wrapper">
            <div id="timeline-loader" class="loading-state" style="margin-top: 60px;">
                <div class="spinner" style="margin: 0 auto 10px;"></div>
                <span>Расшифровка архивов...</span>
            </div>

            <!-- Центральная линия и события -->
            <div id="timeline-content" class="timeline-container" style="display: none;">
                <div class="timeline-center-line"></div>
                <div id="events-container"></div>
            </div>
        </div>

    </main>

    <!-- ТЕМПЛЕЙТЫ ДЛЯ РЕНДЕРИНГА -->

    <!-- Шаблон кнопки навигации -->
    <template id="era-nav-template">
        <button class="era-btn" data-target=""></button>
    </template>

    <!-- Шаблон разделителя эпохи -->
    <template id="era-marker-template">
        <div class="timeline-era-marker">
            <h2 class="era-title"></h2>
        </div>
    </template>

    <!-- Шаблон карточки события -->
    <template id="event-card-template">
        <div class="timeline-event-wrapper">
            <div class="timeline-node"></div>
            <article class="timeline-card">
                <span class="event-date"></span>
                <h3 class="event-title"></h3>
                <p class="event-desc"></p>
                <img src="" class="event-image" loading="lazy" alt="Event image" style="display: none;">
            </article>
        </div>
    </template>

    <!-- Шаблон ошибки -->
    <template id="error-state-template">
        <div class="error-card">
            <p class="error-message"></p>
        </div>
    </template>

    <!-- Правильный путь к модулю -->
    <script type="module" src="pages/timeline/app.js"></script>
</body>
</html>
