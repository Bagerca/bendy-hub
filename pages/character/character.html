<main id="char-content" class="character-page" style="display: none;">
    <div class="char-header-bg" id="char-bg"></div>
    
    <div class="char-container">
        <div class="char-layout">
            <aside class="char-sidebar">
                <div class="sidebar-wrapper">
                    <a href="characters.html" id="back-btn" class="char-back-link">

                        <div class="char-image-wrapper">

                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="9" r="3"></circle><path d="M17.969 20c-.159-2.891-1.044-5-5.969-5-4.925 0-5.81 2.109-5.969 5"></path><path d="M7 3.338C8.471 2.487 10.179 2 12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12c0-1.821.487-3.529 1.338-5"></path></svg>
                            </div>
                            <img id="char-image" src="" alt="Photo" style="display: none;">
                        </div>
                        <div id="char-versions-container" class="char-versions" style="display: none;"></div>
                        <h1 id="char-name" class="char-title"></h1>
                        <div class="char-stats" id="char-meta-container"></div>
                    </div>
                </div>
            </aside>
            
            <div class="char-main">
                <blockquote class="char-quote" id="char-quote" style="display: none;"></blockquote>
                <div class="bento-box large wiki-tabs-wrapper">
                    <nav class="char-tabs">
                        <button class="char-tab active" data-target="tab-overview">Обзор</button>
                        <button class="char-tab" id="btn-tab-history" data-target="tab-history" style="display: none;">История</button>
                        <button class="char-tab" id="btn-tab-records" data-target="tab-records" style="display: none;">
                            Записи <span id="records-badge" class="records-badge"></span>
                        </button>
                        <button class="char-tab" id="btn-tab-trivia" data-target="tab-trivia" style="display: none;">Факты</button>
                    </nav>
                    
                    <div id="tab-overview" class="char-tab-content active">
                        <h3 class="section-title">Внешний вид</h3><p id="char-appearance" class="char-text"></p>
                        <h3 class="section-title mt-4">Личность</h3><p id="char-personality" class="char-text"></p>
                        <h3 class="section-title mt-4">Появления в проектах</h3><div class="appearances-tags" id="char-appearances"></div>
                    </div>
                    
                    <div id="tab-history" class="char-tab-content"><div class="history-timeline" id="char-history"></div></div>
                    
                    <!-- НОВАЯ ВКЛАДКА ЗАПИСЕЙ -->
                    <div id="tab-records" class="char-tab-content">
                        <div class="char-records-grid" id="char-records-grid"></div>
                    </div>

                    <div id="tab-trivia" class="char-tab-content"><ul class="trivia-list" id="char-trivia"></ul></div>
                </div>
            </div>
        </div>
    </div>
</main>
