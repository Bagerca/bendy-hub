<link rel="stylesheet" href="pages/community/community.css">

<main class="page-content community-layout">
    <div class="community-header">
        <h1 class="page-title">Сортировка Музыки</h1>
        <p class="page-subtitle">Распредели треки по категориям, чтобы выгрузить JSON.</p>
    </div>

    <div id="sort-loader" class="loading-state">
        <div class="spinner" style="margin: 0 auto 10px;"></div>
        <span>Загрузка базы треков...</span>
    </div>

    <div id="sort-workspace" class="sort-workspace" style="display: none;">
        <!-- ТЕКУЩИЙ ТРЕК -->
        <div class="active-track-column">
            <div class="active-track-card" id="active-track-card">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <!-- КАТЕГОРИИ -->
        <div class="category-buttons">
            <button class="cat-sort-btn" data-cat="song">🎤 Оригинальная песня</button>
            <button class="cat-sort-btn" data-cat="animation">🎬 Анимация / Клип</button>
            <button class="cat-sort-btn" data-cat="remix">🎛️ Ремикс / Кавер</button>
            <button class="cat-sort-btn" data-cat="instrumental">🎹 Инструментал</button>
            <button class="cat-sort-btn" data-cat="other">❓ Прочее</button>
            <button class="cat-sort-btn skip" data-cat="skip">⏭️ Пропустить (оставить как есть)</button>
        </div>
    </div>

    <div class="sort-actions-bar" id="sort-actions-bar" style="display: none;">
        <div class="sort-progress" id="sort-progress">Осталось: 0</div>
        <div>
            <button class="history-item-undo" id="btn-reset-all" style="margin-right: 10px;">Сбросить прогресс</button>
            <button class="export-btn" id="btn-export">📥 Скачать JSON</button>
        </div>
    </div>

    <div class="history-section" id="history-section" style="display: none;">
        <h2>Уже отсортировано:</h2>
        <div class="history-list" id="history-list"></div>
    </div>
</main>
