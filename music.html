<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Музыка Фандома | Bendy Hub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Shared CSS -->
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/layout.css">
    <link rel="stylesheet" href="shared/css/ui.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="pages/music/music.css">
    <link rel="stylesheet" href="pages/music/song-card.css">
    <link rel="stylesheet" href="pages/music/audio-player.css">
    <link rel="stylesheet" href="pages/music/lyrics-panel.css">
    
    <script>
        const savedTheme = localStorage.getItem('bendy-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <div id="ambient-bg" class="ambient-bg"></div>

    <site-header active-page="music"></site-header>

    <main class="page-content music-layout">
        
        <search-controls placeholder="Поиск по названию трека или исполнителю (Enter)...">
            <div class="view-toggles">
                <button id="btn-view-grid" class="view-btn active" title="Сетка" aria-label="Вид сеткой">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </button>
                <button id="btn-view-list" class="view-btn" title="Список" aria-label="Вид списком">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
            </div>
        </search-controls>

        <div id="music-loader" class="loading-state">
            <div class="spinner" style="margin: 0 auto 10px;"></div>
            <span>Настройка радиоволны...</span>
        </div>

        <div class="music-grid" id="music-grid" style="display: none;"></div>

    </main>

    <!-- ГЛОБАЛЬНЫЙ КАСТОМНЫЙ АУДИОПЛЕЕР -->
    <div id="global-player" class="global-player">
        
        <div class="player-progress-bar-container">
            <input type="range" id="progress-slider" class="custom-slider" min="0" max="100" value="0" step="0.1">
        </div>
        
        <div class="player-content">
            <div class="player-track-info">
                <img id="player-cover" src="" alt="Cover" class="player-cover">
                <div class="player-text">
                    <h4 id="player-title">Название трека</h4>
                    <p id="player-artist">Исполнитель</p>
                </div>
            </div>

            <div class="player-controls">
                <button id="btn-shuffle" class="player-btn control-small" title="Перемешать">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
                </button>
                
                <button id="btn-prev" class="player-btn" title="Предыдущий">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <button id="btn-play-pause" class="player-btn play-btn" title="Play/Pause">
                    <svg id="icon-play" class="optical-center" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6v12l10-6z"/></svg>
                    <svg id="icon-pause" style="display: none;" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <button id="btn-next" class="player-btn" title="Следующий">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>

                <button id="btn-repeat" class="player-btn control-small" title="Повтор трека">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                </button>
            </div>

            <div class="player-extra">
                <span id="time-current" class="time-stamp">0:00</span>
                <span class="time-stamp separator">/</span>
                <span id="time-total" class="time-stamp">0:00</span>
                
                <div class="volume-container">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <input type="range" id="volume-slider" class="custom-slider" min="0" max="1" step="0.01" value="1" title="Громкость">
                </div>
                
                <button id="btn-lyrics" class="player-btn extra-btn" title="Текст песни">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </button>
            </div>
        </div>
        
        <audio id="html5-audio" preload="metadata"></audio>
    </div>

    <!-- ВЫЕЗЖАЮЩАЯ ПАНЕЛЬ С ТЕКСТОМ ПЕСНИ -->
    <aside id="lyrics-panel" class="lyrics-sidepanel">
        <div class="lyrics-header">
            <div>
                <h2 id="lyrics-title">Название</h2>
                <a id="lyrics-youtube" href="#" target="_blank" class="yt-link">Смотреть на YouTube</a>
            </div>
            <button class="panel-close" aria-label="Закрыть">&times;</button>
        </div>
        <div class="lyrics-body">
            <div class="lyrics-col">
                <h3>Оригинал</h3>
                <p id="lyrics-original"></p>
            </div>
            <div class="lyrics-col">
                <h3>Перевод</h3>
                <p id="lyrics-translation"></p>
            </div>
        </div>
    </aside>
    
    <div id="lyrics-overlay" class="lyrics-overlay"></div>

    <!-- ТЕМПЛЕЙТЫ -->
    <template id="song-card-template">
        <article class="song-card">
            <div class="song-cover-wrapper">
                <img src="" alt="" class="song-cover" loading="lazy">
                <div class="song-overlay"></div>
                
                <div class="eq-animation">
                    <span></span><span></span><span></span>
                </div>
                
                <button class="song-play-btn">
                    <svg class="play-icon optical-center" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6v12l10-6z"/></svg>
                    <svg class="pause-icon" style="display:none;" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
            <div class="song-info">
                <div class="song-text-wrap">
                    <h3 class="song-title"></h3>
                    <p class="song-artist"></p>
                </div>
                <div class="song-meta">
                    <span class="song-year"></span>
                    <span class="song-game"></span>
                </div>
            </div>
        </article>
    </template>

    <template id="empty-state-template">
        <div class="empty-state">
            <div class="empty-state-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <h3 class="empty-state-title">Трек не найден</h3>
            <p class="empty-state-desc">По вашему запросу ничего не найдено. Попробуйте изменить ключевые слова.</p>
        </div>
    </template>

    <template id="error-state-template">
        <div class="error-card" style="grid-column: 1/-1">
            <p class="error-message"></p>
        </div>
    </template>

    <script type="module" src="pages/music/app.js"></script>
</body>
</html>
