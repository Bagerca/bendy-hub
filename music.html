<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Музыка Фандома | Bendy Hub</title>
    
    <link rel="stylesheet" href="shared/css/variables.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/layout.css">
    <link rel="stylesheet" href="shared/css/ui.css">
    <link rel="stylesheet" href="pages/music/music.css">
    
    <script>
        const savedTheme = localStorage.getItem('bendy-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <site-header active-page="music"></site-header>

    <main class="page-content music-layout">
        
        <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
        <search class="archive-controls feed-controls">
            <div class="search-input-wrapper">
                <button id="search-btn" class="search-btn" aria-label="Найти">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <input type="text" id="search-input" placeholder="Поиск по названию трека или исполнителю (Enter)..." aria-label="Поиск">
            </div>
        </search>

        <div id="music-loader" class="loading-state">
            <div class="spinner" style="margin: 0 auto 10px;"></div>
            <span>Настройка радиоволны...</span>
        </div>

        <!-- Сетка треков -->
        <div class="music-grid" id="music-grid" style="display: none;"></div>

        <!-- Пустое состояние -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>
            <h3 class="empty-state-title">Трек не найден</h3>
            <p class="empty-state-desc">По вашему запросу ничего не найдено. Попробуйте изменить ключевые слова.</p>
        </div>

    </main>

    <!-- ГЛОБАЛЬНЫЙ КАСТОМНЫЙ АУДИОПЛЕЕР -->
    <div id="global-player" class="global-player">
        <div class="player-progress-bar-container" id="progress-container">
            <div class="player-progress" id="progress-bar"></div>
        </div>
        
        <div class="player-content">
            <div class="player-track-info">
                <img id="player-cover" src="" alt="Cover" class="player-cover">
                <div class="player-text">
                    <h4 id="player-title">Название трека</h4>
                    <p id="player-artist">Исполнитель</p>
                </div>
            </div>

            <div class="player-controls">
                <button id="btn-prev" class="player-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
                </button>
                <button id="btn-play-pause" class="player-btn play-btn">
                    <!-- Иконка Play -->
                    <svg id="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <!-- Иконка Pause -->
                    <svg id="icon-pause" style="display: none;" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button id="btn-next" class="player-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
                </button>
            </div>

            <div class="player-extra">
                <span id="time-current" class="time-stamp">0:00</span>
                <span class="time-stamp">/</span>
                <span id="time-total" class="time-stamp">0:00</span>
                
                <button id="btn-lyrics" class="player-btn extra-btn" title="Текст песни">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </button>
            </div>
        </div>
        
        <audio id="html5-audio" preload="metadata"></audio>
    </div>

    <!-- МОДАЛКА С ТЕКСТОМ ПЕСНИ -->
    <dialog id="lyrics-modal" class="custom-modal lyrics-modal">
        <button class="modal-close" aria-label="Закрыть">&times;</button>
        <div class="lyrics-header">
            <h2 id="lyrics-title"></h2>
            <a id="lyrics-youtube" href="#" target="_blank" class="yt-link">Смотреть на YouTube</a>
        </div>
        <div class="lyrics-body">
            <div class="lyrics-col">
                <h3>Оригинал</h3>
                <p id="lyrics-original"></p>
            </div>
            <div class="lyrics-col">
                <h3>Перевод</h3>
                <p id="lyrics-translation"></p>
            </div>
        </div>
    </dialog>

    <!-- ШАБЛОН КАРТОЧКИ ТРЕКА -->
    <template id="song-card-template">
        <article class="song-card">
            <div class="song-cover-wrapper">
                <img src="" alt="" class="song-cover" loading="lazy">
                <div class="song-overlay">
                    <button class="song-play-btn">
                        <svg class="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <div class="eq-animation" style="display: none;">
                            <span></span><span></span><span></span>
                        </div>
                    </button>
                </div>
            </div>
            <div class="song-info">
                <h3 class="song-title"></h3>
                <p class="song-artist"></p>
                <div class="song-meta">
                    <span class="song-year"></span>
                    <span class="song-game"></span>
                </div>
            </div>
        </article>
    </template>

    <script type="module" src="pages/music/app.js"></script>
</body>
</html>
